<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>神大 空き教室</title>
<meta name="description" content="神戸大学の公開時間割から、授業が入っていない教室を探す非公式ツール">
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --ink: #1b1f24; --ink-2: #57606a; --line: #dcd9d0;
  --accent: #0b4f6c; --accent-ink: #ffffff; --accent-soft: #e3eef2; --warn: #8a5a00;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171a; --surface: #1d2126; --ink: #e9ecef; --ink-2: #a3acb5; --line: #343a41;
    --accent: #7cc4de; --accent-ink: #0c1b22; --accent-soft: #1f3540; --warn: #f0c36d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--line) transparent; }
body {
  margin: 0; background: var(--bg); color: var(--ink); accent-color: var(--accent); caret-color: var(--accent);
  font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  font-variant-numeric: tabular-nums;
}
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
svg { width: 16px; height: 16px; flex: none; }
main { max-width: 720px; margin: 0 auto; padding: 16px 16px 56px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 1.125rem; margin: 0; letter-spacing: .02em; }
.now {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 14px; min-height: 36px;
  font-size: .875rem; display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s, color .15s;
}
.now:hover { border-color: var(--accent); }
.now[aria-pressed="true"] { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }

.tabs { display: flex; gap: 0; justify-content: space-between; margin: 10px -16px 14px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: none; min-height: 44px; padding: 0 6px; border: 0; background: none; color: var(--ink-2); font-size: .875rem;
  white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }

.controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
#periods { grid-column: 1 / -1; }
.seg { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 3px; min-width: 0; }
.seg button {
  flex: 1 1 0; min-width: 36px; min-height: 40px; padding: 4px 6px; border: 0; border-radius: 7px; background: transparent;
  white-space: nowrap; line-height: 1.2; transition: background .15s, color .15s;
}
.seg button:hover { background: var(--accent-soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button small { display: block; font-size: .6875rem; font-weight: 400; opacity: .75; margin-top: 1px; }
#quarters button { min-width: 44px; }

.summary { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin: 24px 0 4px; }
.count { margin: 0; font-size: .875rem; color: var(--ink-2); }
.count b { font-size: 1.375rem; font-weight: 700; color: var(--ink); margin-right: 2px; }
.note { margin: 0; display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--ink-2); }
.note svg { color: var(--warn); width: 14px; height: 14px; }

.group { padding: 12px 0; border-top: 1px solid var(--line); }
.group:first-child { margin-top: 8px; }
h2 { font-size: .8125rem; font-weight: 600; color: var(--ink-2); margin: 0 0 8px; }
.rooms { display: flex; flex-wrap: wrap; gap: 6px; }
.room {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 10px; min-height: 40px; min-width: 56px;
  display: inline-flex; align-items: baseline; justify-content: center; gap: 6px; line-height: 38px;
  transition: border-color .15s, background .15s;
}
.room:hover { border-color: var(--accent); }
.room:active { background: var(--accent-soft); }
.room[aria-expanded="true"] { border-color: var(--accent); background: var(--accent-soft); }
.room b { font-weight: 600; }
.room span { font-size: .75rem; color: var(--ink-2); }
.room.rest span { color: var(--accent); font-weight: 600; }
@media (min-width: 600px) {
  .tabs { justify-content: flex-start; gap: 8px; }
  .tabs button { font-size: .9375rem; padding: 0 10px; }
  .group { display: grid; grid-template-columns: 7.5rem 1fr; gap: 12px; }
  h2 { margin: 0; line-height: 40px; }
}

.week { margin: 2px 0 6px; padding: 14px; background: var(--surface); border: 1px solid var(--accent); border-radius: var(--radius); width: 100%; }
.week h3 { margin: 0 0 10px; font-size: .9375rem; display: flex; justify-content: space-between; align-items: baseline; }
.week h3 small { font-size: .75rem; font-weight: 400; color: var(--ink-2); }
.week table { border-collapse: separate; border-spacing: 3px; margin: -3px; width: calc(100% + 6px); max-width: 400px; table-layout: fixed; }
.week th { font-size: .75rem; font-weight: 500; color: var(--ink-2); padding: 0; }
.week th:first-child { width: 20px; }
.week td { height: 26px; border-radius: 5px; background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.week td.busy { background: color-mix(in srgb, var(--ink-2) 55%, var(--surface)); }
.week td.sel { box-shadow: inset 0 0 0 2px var(--accent); }
.week td.busy.sel { box-shadow: inset 0 0 0 2px var(--ink); }
.week p { margin: 10px 0 0; font-size: .75rem; color: var(--ink-2); display: flex; gap: 14px; }
.week i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.week i.busy { background: color-mix(in srgb, var(--ink-2) 55%, var(--surface)); }
.empty { color: var(--ink-2); margin: 32px 0; }

footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: .75rem; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
footer a { color: inherit; text-underline-offset: 3px; }
footer a:hover { color: var(--ink); }
footer details { flex-basis: 100%; }
footer summary { cursor: pointer; width: fit-content; padding: 4px 0; }
footer ul { margin: 6px 0 0; padding-left: 1.2em; columns: 2 260px; }
footer li { margin: 2px 0; break-inside: avoid; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>神大 空き教室</h1>
    <button class="now" id="now" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.5V8l2.25 1.5"/></svg>
      いま
    </button>
  </header>
  <nav class="tabs" id="areas" aria-label="エリア"></nav>
  <div class="controls">
    <div class="seg" id="days" role="group" aria-label="曜日"></div>
    <div class="seg" id="quarters" role="group" aria-label="クォーター"></div>
    <div class="seg" id="periods" role="group" aria-label="時限"></div>
  </div>
  <div class="summary">
    <p class="count" id="count" aria-live="polite"></p>
    <p class="note">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.25 14.25 13H1.75L8 2.25Z"/><path d="M8 6.5v3"/><path d="M8 11.4v.1"/></svg>
      補講・試験・施錠は反映していません
    </p>
  </div>
  <div id="out"></div>
  <footer>
    <span id="meta"></span>
    <span>神戸大学 非公式</span>
    <details>
      <summary>出典の時間割</summary>
      <ul id="sources"></ul>
    </details>
  </footer>
</main>
<script>
const INLINE = /*__DATA__*/null;
const DAYS = ["月", "火", "水", "木", "金", "土"];
const TIMES = { 1: "8:50", 2: "10:40", 3: "13:20", 4: "15:10", 5: "17:00", 6: "18:50" };
const ENDS = { 1: 1020, 2: 1210, 3: 1450, 4: 1640, 5: 1830, 6: 2020 };
const $ = (id) => document.getElementById(id);
let data, state, openRoom = null;

function quarterOn(date) {
  const iso = date.toLocaleDateString("sv-SE");
  for (const [q, [a, b]] of Object.entries(data.quarters)) if (a <= iso && iso <= b) return q;
  const qs = Object.keys(data.quarters);
  return iso < data.quarters[qs[0]][0] ? qs[0] : qs[qs.length - 1];
}
function nowState() {
  let d = new Date();
  const hhmm = d.getHours() * 100 + d.getMinutes(), weekday = d.getDay();
  let period = weekday >= 1 && weekday <= 5 ? Object.keys(ENDS).map(Number).find((p) => hhmm <= ENDS[p]) : undefined;
  if (!period) { // 授業時間外は次の平日の1限
    do d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); while (d.getDay() === 0 || d.getDay() === 6);
    period = 1;
  }
  return { day: DAYS[d.getDay() - 1], period, quarter: quarterOn(d) };
}
function shortName(room, key) {
  return /^[A-Z0-9]+$/.test(key) ? room : room.slice(key.length) || room;
}
function building(room) {
  const m = room.match(/^(LR|[A-Z]\d?(?=-)|\d[EW](?=-)|[A-Z]+|.*?(?:館|学舎)|[^\d]+)/);
  return m ? m[1].replace(/-$/, "") : room;
}
function busySet(slots, day, quarter) {
  const prefix = day + "|" + quarter + "|", set = new Set();
  for (const s of slots) if (s.startsWith(prefix)) set.add(Number(s.slice(prefix.length)));
  return set;
}
function areaInfo(area) {
  const rooms = data.areas[area];
  let maxPeriod = 5, saturday = false;
  for (const slots of Object.values(rooms)) for (const s of slots) {
    const [d, , p] = s.split("|");
    if (Number(p) > maxPeriod) maxPeriod = Number(p);
    if (d === "土") saturday = true;
  }
  return { rooms, maxPeriod, days: saturday ? DAYS : DAYS.slice(0, 5) };
}
function seg(id, items, current, onPick) {
  const el = $(id);
  const focused = el.contains(document.activeElement);
  el.replaceChildren(...items.map(({ value, label, sub }) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed", String(value === current));
    b.append(label);
    if (sub) { const s = document.createElement("small"); s.textContent = sub; b.append(s); }
    b.onclick = () => onPick(value);
    return b;
  }));
  const pressed = el.querySelector('[aria-pressed="true"]');
  pressed?.scrollIntoView({ block: "nearest", inline: "nearest" });
  if (focused) pressed?.focus();
}
function weekTable(room, slots, info) {
  const box = document.createElement("div");
  box.className = "week";
  const h = document.createElement("h3");
  const q = document.createElement("small"); q.textContent = state.quarter;
  h.append(room, q);
  const table = document.createElement("table");
  const head = table.insertRow();
  head.append(document.createElement("th"));
  for (const d of info.days) { const th = document.createElement("th"); th.textContent = d; head.append(th); }
  for (let p = 1; p <= info.maxPeriod; p++) {
    const tr = table.insertRow();
    const th = document.createElement("th"); th.textContent = p; tr.append(th);
    for (const d of info.days) {
      const td = tr.insertCell();
      const busy = slots.includes(d + "|" + state.quarter + "|" + p);
      if (busy) td.className = "busy";
      if (d === state.day && p === state.period) td.classList.add("sel");
      td.title = d + "曜" + p + "限 " + (busy ? "授業あり" : "授業なし");
      td.setAttribute("aria-label", td.title);
    }
  }
  const legend = document.createElement("p");
  legend.innerHTML = '<span><i></i>授業なし</span><span><i class="busy"></i>授業あり</span>';
  box.append(h, table, legend);
  return box;
}
function render() {
  const areas = Object.keys(data.areas);
  if (!areas.includes(state.area)) state.area = areas[0];
  const info = areaInfo(state.area);
  if (!info.days.includes(state.day)) state.day = "月";
  if (state.period > info.maxPeriod) state.period = info.maxPeriod;
  const set = (key) => (value) => { state[key] = value; if (key === "area") openRoom = null; save(); render(); };
  seg("areas", areas.map((a) => ({ value: a, label: a })), state.area, set("area"));
  seg("days", info.days.map((d) => ({ value: d, label: d })), state.day, set("day"));
  seg("periods", Array.from({ length: info.maxPeriod }, (_, i) => ({ value: i + 1, label: i + 1 + "限", sub: TIMES[i + 1] })), state.period, set("period"));
  seg("quarters", Object.keys(data.quarters).map((q) => ({ value: q, label: q })), state.quarter, set("quarter"));

  const groups = new Map();
  let free = 0;
  for (const [room, slots] of Object.entries(info.rooms)) {
    const busy = busySet(slots, state.day, state.quarter);
    if (busy.has(state.period)) continue;
    let until = state.period;
    while (until < info.maxPeriod && !busy.has(until + 1)) until++;
    const key = building(room);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ room, slots, until });
    free++;
  }
  const total = Object.keys(info.rooms).length;
  const n = document.createElement("b"); n.textContent = free;
  $("count").replaceChildren(n, ` / ${total} 教室　授業なし`);
  const now = nowState();
  $("now").setAttribute("aria-pressed", String(now.day === state.day && Math.min(now.period, info.maxPeriod) === state.period && now.quarter === state.quarter));
  const out = $("out");
  out.replaceChildren();
  if (!free) {
    const p = document.createElement("p"); p.className = "empty"; p.textContent = "空き教室なし"; out.append(p);
  }
  for (const key of [...groups.keys()].sort((a, b) => a.localeCompare(b, "ja"))) {
    const h = document.createElement("h2"); h.textContent = /^[A-Z0-9]+$/.test(key) ? key + "棟" : key;
    const list = document.createElement("div"); list.className = "rooms";
    for (const { room, slots, until } of groups.get(key)) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "room" + (until === info.maxPeriod ? " rest" : "");
      b.setAttribute("aria-expanded", String(openRoom === room));
      const name = document.createElement("b"); name.textContent = shortName(room, key); b.append(name);
      b.setAttribute("aria-label", room + (until > state.period ? ` ${until}限まで授業なし` : ""));
      if (until > state.period) {
        const s = document.createElement("span");
        s.textContent = "〜" + until + "限";
        b.append(s);
      }
      b.dataset.room = room;
      b.onclick = () => {
        openRoom = openRoom === room ? null : room;
        render();
        [...document.querySelectorAll(".room")].find((e) => e.dataset.room === room)?.focus();
      };
      list.append(b);
      if (openRoom === room) list.append(weekTable(room, slots, info));
    }
    const group = document.createElement("section"); group.className = "group";
    group.append(h, list);
    out.append(group);
  }
}
function save() { try { localStorage.setItem("akikyoshitsu.area", state.area); } catch {} }
function start(loaded) {
  data = loaded;
  let area = null;
  try { area = localStorage.getItem("akikyoshitsu.area"); } catch {}
  state = { area, ...nowState() };
  $("now").onclick = () => { Object.assign(state, nowState()); render(); };
  $("meta").textContent = data.title;
  $("sources").replaceChildren(...data.sources.map((s) => {
    const li = document.createElement("li"), a = document.createElement("a");
    a.href = s.url; a.textContent = s.title; a.rel = "noopener"; li.append(a); return li;
  }));
  render();
}
// データは `akikyoshitsu html` がこのファイルに埋め込む
if (INLINE) start(INLINE);
else $("count").textContent = "時間割データがありません。";
</script>
</body>
</html>
