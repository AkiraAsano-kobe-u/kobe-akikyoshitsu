# 文学部・人文学研究科 (六甲台第1キャンパス 文学部の建物)
# 一覧: http://www.lit.kobe-u.ac.jp/students/syllabus.html
# 全学共通科目 (zengaku_2026b.pdf) は別キャンパスの教室なので載せていない。
#
# 教室名: 文学部の建物は A棟・B棟・C棟 で「棟記号+3桁」(例 B132 = B棟1階2号室ではなく
# 3桁の最初の数字が階)。PDFに凡例は無いので、表記をそのまま使う。
# 「※1」は各PDFの脚注 (鶴甲第一キャンパスD棟5階 D503) を指し、パーサが「鶴1D503」にして
# ここで鶴甲第1に振り分ける。

[defaults]
parser = "letters_grid"
area = "文学部"
page = "http://www.lit.kobe-u.ac.jp/students/syllabus.html"
# 教室: A221 B132 C262 (全角混在あり、NFKCで半角になる)
room_pattern = "[ABC]\\d{3}|D503"
strip = "^鶴1"
[defaults.foreign]
"鶴甲第1" = "^鶴1"

[[source]]
id = "lit-bachelor"
