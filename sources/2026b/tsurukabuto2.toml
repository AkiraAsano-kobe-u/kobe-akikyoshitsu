# 鶴甲第2キャンパス: 国際人間科学部 (発達コミュニティ学科・環境共生学科・子ども教育学科) と人間発達環境学研究科
# 一覧: https://www.fgh.kobe-u.ac.jp/ja/node/123
#       https://www.h.kobe-u.ac.jp/ja/node/1110
#
# 教室表記とキャンパス (どちらも鶴甲第1・第2に A〜G 棟があり、同じ B210 でも別の部屋になりうる)
#  - 国際人間科学部の3PDF: 凡例「★ 鶴甲第二キャンパスの教室」。★ の付いた教室は鶴甲第2、
#    ★ の無い教室 (D5xx, F101, F102, F301, F401, K502, B109, C301 など) は鶴甲第1。
#    ★ は core.split_token に捨てられてしまうので、パーサ grid_ext の star_prefix で「鶴2」に置き換えて運ぶ。
#  - 人間発達環境学研究科の PDF: 注意事項「上記の教室欄に記載した講義場所は、(特に記載が無い場合は) すべて
#    鶴甲第二キャンパスである。」(前期課程・後期課程。前期課程1年履修コースには注記が無いが同研究科・同じ棟の表記)。
# 大学院の5限は 17:50-19:20、6限は 19:30-21:00 (標準の5限17:00-18:30・6限18:50-20:20と時刻が違う)。
# 重なる標準時限をすべて使用中にする: 5限 -> 5,6 / 6限 -> 6 / 7限 (21:10-) は表現できないので捨てる。

[defaults]
parser = "grid_ext"
area = "鶴甲第2"

# ---- 国際人間科学部 (★ = 鶴甲第2, 無印 = 鶴甲第1) ----
