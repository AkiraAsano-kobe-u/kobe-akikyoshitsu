# 国際協力研究科: 教室は建物記号の無い「206」(国際協力研究科棟=第五学舎) と略号 PR / SI。
# 略号は同PDFの凡例: PR=4F プレゼンテーションルーム, SI=6F シミュレーションルーム(GNP room), 411=4F 情報処理演習室, Office=研究室
[[source]]
id = "gsics"
title = "国際協力研究科 後期時間割 (前期課程・後期課程)"
url = "https://www.gsics.kobe-u.ac.jp/storage/001/202611/261110_2026_Timetable_FallSemester.pdf"
page = "https://www.gsics.kobe-u.ac.jp/students/schedule.html"
parser = "rk1_gsics"
# 「工C2-302」は工学部キャンパスの教室
strip = "^工"
room_pattern = "(?:本館|第[二三四五]学舎|アカデミア館|フロンティア館)\\d{3}|第五学舎(?:プレゼンテーション|シミュレーション)ルーム|[BCDKM]\\d{3}|C\\d-\\d{3}"
foreign = { "工学部" = "^工C\\d-\\d{3}$", "鶴甲第1" = "^[BCDKM]\\d{3}$" }

[source.rename]
"^(\\d{3})$" = "第五学舎\\1"
"^PR$" = "第五学舎プレゼンテーションルーム"
"^SI$" = "第五学舎シミュレーションルーム"
"^I(\\d{3})$" = "本館\\1"
"^II(\\d{3})$" = "第二学舎\\1"
"^III(\\d{3})$" = "第三学舎\\1"
"^IV(\\d{3})$" = "第四学舎\\1"
"^V(?:学舎)?(\\d{3})$" = "第五学舎\\1"
"^(?:VI|ア)(\\d{3})$" = "アカデミア館\\1"
"^(?:VII|フ)(\\d{3})$" = "フロンティア館\\1"
