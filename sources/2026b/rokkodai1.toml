# 六甲台第1キャンパス (法学部・法学研究科・法科大学院・経済学部・経済学研究科・経営学部・経営学研究科・国際協力研究科)
# 各学部の一覧: https://www.law.kobe-u.ac.jp/ungr/student-basic-ungr.html (法)
#   https://www.econ.kobe-u.ac.jp/class-registration-undergrad/ (経済) https://b.kobe-u.ac.jp/ugrad/ (経営)
#   https://www.gsics.kobe-u.ac.jp/students/schedule.html (国際協力)
#
# 教室名は「<建物名><番号>」にそろえる。建物名は 本館 / 第二学舎 / 第三学舎 / 第四学舎 / 第五学舎 / アカデミア館 / フロンティア館。
# 各PDFの凡例 (教室表示) と読み替え:
#   法学部      Ⅰ=六甲台本館 Ⅱ=第二学舎 Ⅲ=第三学舎 ア=アカデミア館 フ=フロンティア館 (●=六甲台第2は捨てる)
#   法学研究科  Ⅰ=第一学舎(経済・経営学部) Ⅱ=第二学舎(法学部) Ⅲ=第三学舎 Ⅳ=第四学舎 Ⅴ=第五学舎(国際協力研究科) ア=アカデミア館 フ=フロンティア館
#   法科大学院  Ⅰ=第一学舎(本館) Ⅱ=第二学舎(法学部) ア=アカデミア館 フ=フロンティア館
#   経済学部    Ⅰ=第一学舎(本館) Ⅱ=第二学舎(法学部学舎) Ⅲ=第三学舎 Ⅳ=第四学舎 Ⅴ=第五学舎(国際協力研究科学舎) Ⅵ=第六学舎(アカデミア館) Ⅶ=第七学舎(フロンティア館) 情報処理室=第三学舎2階
#   経済学研究科 Ⅰ=六甲台本館 Ⅱ=法学部学舎 Ⅲ=第3学舎 Ⅳ=第4学舎 Ⅴ=国際協力研究科棟 Ⅵ=アカデミア館 Ⅶ=フロンティア館 情報処理室=第3学舎2階
#   経営学部/研究科 Ⅰ=六甲台本館〈第1学舎〉 Ⅲ=第3学舎 Ⅳ=第4学舎 Ⅴ=第5学舎 Ⅵ=アカデミア館 Ⅶ=フロンティア館 三木=三木記念館 (V学舎201 は Ⅴ201 と同じ)
#   国際協力研究科 I=経済・経営本館 Ⅱ=第2学舎 Ⅲ=第3学舎 Ⅳ=第4学舎 VI=アカデミア館 フ=フロンティア館 C=鶴甲第1C棟 工=工学部
#                  PR=4F プレゼンテーションルーム SI=6F シミュレーションルーム 411=4F 情報処理演習室 Office=研究室 (建物記号の無い 206 は国際協力研究科棟=第五学舎)
# 三木記念館(三木1〜3)・研究室・農/工学部の教室・六甲台第2の教室は捨てる。
[defaults]
parser = "rk1_lawgr"
area = "六甲台第1"
room_pattern = "(?:本館|第[二三四五]学舎|アカデミア館|フロンティア館)\\d{3}|第五学舎(?:プレゼンテーション|シミュレーション)ルーム|第三学舎情報処理室|[BCDKM]\\d{3}"

# 全学共通授業科目の教室 (B110, D303 ...) は鶴甲第1キャンパスの教室
[defaults.foreign]
"鶴甲第1" = "^[BCDKM]\\d{3}$"

[defaults.rename]
# 情報処理室は第三学舎2階 (経済学部・経済学研究科の時間割の教室表示)
"^情報処理室$" = "第三学舎情報処理室"
"^I(\\d{3})$" = "本館\\1"
"^II(\\d{3})$" = "第二学舎\\1"
"^III(\\d{3})$" = "第三学舎\\1"
"^IV(\\d{3})$" = "第四学舎\\1"
"^V(?:学舎)?(\\d{3})$" = "第五学舎\\1"
"^(?:VI|ア)(\\d{3})$" = "アカデミア館\\1"
"^(?:VII|フ)(\\d{3})$" = "フロンティア館\\1"

